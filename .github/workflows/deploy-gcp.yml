name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-gcp.yml'
  workflow_dispatch: # Allow manual deployment

env:
  PROJECT_ID: ai-mvp-452812
  SERVICE_NAME: innovation-scorer
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/ai-mvp-452812/cloud-run-source-deploy/innovation-scorer

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Build and Push with Cloud Build
      run: |
        # Submit build and ignore log streaming errors (build still succeeds)
        gcloud builds submit --tag ${{ env.IMAGE }}:${{ github.sha }} --async
        
        # Get the build ID
        BUILD_ID=$(gcloud builds list --limit=1 --format='value(id)')
        echo "Build ID: $BUILD_ID"
        
        # Wait for build to complete
        echo "Waiting for build to complete..."
        while true; do
          STATUS=$(gcloud builds describe $BUILD_ID --format='value(status)')
          echo "Build status: $STATUS"
          if [ "$STATUS" = "SUCCESS" ]; then
            echo "Build completed successfully!"
            break
          elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
            echo "Build failed with status: $STATUS"
            exit 1
          fi
          sleep 10
        done

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image ${{ env.IMAGE }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --service-account=695406125250-compute@developer.gserviceaccount.com \
          --port=8080 \
          --memory=1Gi \
          --cpu=1 \
          --timeout=300 \
          --min-instances=0 \
          --max-instances=10

    - name: Get service URL
      id: get-url
      run: |
        URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
        echo "service-url=$URL" >> $GITHUB_OUTPUT
        echo "✅ Service deployed successfully!"
        echo "🌐 Service URL: $URL"

    - name: Update deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "🎉 Deployment completed successfully!"
          echo "📱 Service URL: ${{ steps.get-url.outputs.service-url }}"
        else
          echo "💥 Deployment failed!"
        fi
